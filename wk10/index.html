<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            --bg-color: #fdfefe;
            --surface-color: #17251a;
            --primary-color: #166936;
            --secondary-color: #24b55f;
            --text-main: #e2f2e7;
            --text-muted: #8ca393;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.5rem;
            text-shadow: 0 0 15px rgba(59, 246, 134, 0.4);
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .student-card {
            background-color: var(--surface-color);
            border: 1px solid rgba(59, 246, 134, 0.15);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .student-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary-color), var(--primary-color));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(59, 246, 134, 0.15);
            border-color: rgba(59, 246, 134, 0.4);
        }

        .student-card:hover::before {
            opacity: 1;
        }

        .student-id {
            color: var(--secondary-color);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .student-name {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #ffffff;
        }

        .student-dept {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .student-marks {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(59, 246, 134, 0.08);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid rgba(59, 246, 134, 0.1);
        }

        .marks-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .marks-value {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .loading,
        .error {
            text-align: center;
            font-size: 1.2rem;
            margin-top: 3rem;
            padding: 2rem;
            border-radius: 12px;
            background: var(--surface-color);
        }

        .error {
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }

        .loading {
            color: var(--primary-color);
            border: 1px solid rgba(59, 246, 134, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .add-form-container {
            background-color: var(--surface-color);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid rgba(59, 246, 134, 0.15);
            margin-bottom: 2.5rem;
            width: 100%;
            max-width: 1200px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .add-form-container h2 {
            margin-top: 0;
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .student-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input {
            background-color: var(--bg-color);
            border: 1px solid rgba(59, 246, 134, 0.2);
            color: var(--text-main);
            padding: 0.8rem;
            border-radius: 8px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(59, 246, 134, 0.2);
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: #0f1711;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s;
            height: 44px;
            font-family: inherit;
        }

        .submit-btn:hover {
            background-color: #2ce676;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <h1>Student Dashboard</h1>

    <div class="add-form-container">
        <h2>Add New Student</h2>
        <form id="add-student-form" class="student-form">
            <div class="form-group">
                <label for="student-id-input">ID</label>
                <input type="number" id="student-id-input" required placeholder="e.g. 11">
            </div>
            <div class="form-group">
                <label for="student-name-input">Name</label>
                <input type="text" id="student-name-input" required placeholder="Student Name">
            </div>
            <div class="form-group">
                <label for="student-dept-input">Department</label>
                <input type="text" id="student-dept-input" required placeholder="e.g. Computer Science">
            </div>
            <div class="form-group">
                <label for="student-marks-input">Marks</label>
                <input type="number" id="student-marks-input" required placeholder="e.g. 85">
            </div>
            <button type="submit" class="submit-btn">Add Student</button>
        </form>
    </div>

    <div id="loading" class="loading">Fetching records...</div>
    <div id="error" class="error" style="display: none;"></div>

    <div id="student-grid" class="student-grid"></div>

    <script src="app.js"></script>
</body>

</html>
