<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory - CRUD Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow);
            animation: fadeIn 0.6s ease-out;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1.5fr;
            }
        }

        /* Form Styling */
        .form-section {
            background: rgba(15, 23, 42, 0.4);
            padding: 1.75rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .form-section h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: none;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: rgba(148, 163, 184, 0.2);
        }

        /* List Section */
        .list-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .list-header h2 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .counter {
            background: rgba(99, 102, 241, 0.15);
            color: #a5b4fc;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .search-bar {
            width: 100%;
            margin-bottom: 1rem;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 0.5rem;
        }

        /* Custom Scrollbar */
        .card-list::-webkit-scrollbar {
            width: 6px;
        }

        .card-list::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.2);
            border-radius: 10px;
        }

        .card-list::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 10px;
        }

        .card {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease-out;
        }

        .card:hover {
            transform: translateX(4px);
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(30, 41, 59, 0.6);
        }

        .card-info h3 {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .card-info p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .card-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            color: var(--text-primary);
        }

        .btn-icon.edit:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }

        .btn-icon.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            border-radius: 12px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>User Profiles</h1>
            <p>A sleek, client-side CRUD application to manage user directory records.</p>
        </header>

        <div class="grid">
            <!-- Form Section (Create / Update) -->
            <div class="form-section">
                <h2 id="form-title">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>
                    Create Profile
                </h2>
                <form id="crud-form" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="entry-id">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" class="form-input" placeholder="e.g. John Doe" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" class="form-input" placeholder="e.g. 28" required min="0" max="150">
                    </div>
                    <div class="btn-group">
                        <button type="button" id="btn-cancel" class="btn btn-secondary" onclick="resetForm()" style="display: none;">Cancel</button>
                        <button type="submit" id="btn-submit" class="btn btn-primary">Save Profile</button>
                    </div>
                </form>
            </div>

            <!-- List Section (Read / Delete) -->
            <div class="list-section">
                <div class="list-header">
                    <h2>Directory</h2>
                    <span id="record-count" class="counter">0 records</span>
                </div>
                
                <input type="text" id="search" class="form-input search-bar" placeholder="Search profiles by name..." oninput="renderRecords()">

                <div id="card-list" class="card-list">
                    <!-- Cards will be populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // State Management
        let records = JSON.parse(localStorage.getItem('crud_records')) || [];
        let editMode = false;

        // Save to LocalStorage
        function saveToStorage() {
            localStorage.setItem('crud_records', JSON.stringify(records));
        }

        // Form Submit Handler (Create or Update)
        function handleFormSubmit(e) {
            e.preventDefault();
            const idInput = document.getElementById('entry-id').value;
            const nameInput = document.getElementById('name').value.trim();
            const ageInput = document.getElementById('age').value;

            if (!nameInput || !ageInput) return;

            if (editMode) {
                // Update
                records = records.map(record => {
                    if (record.id === idInput) {
                        return { ...record, name: nameInput, age: parseInt(ageInput) };
                    }
                    return record;
                });
                editMode = false;
            } else {
                // Create
                const newRecord = {
                    id: Date.now().toString(),
                    name: nameInput,
                    age: parseInt(ageInput)
                };
                records.push(newRecord);
            }

            saveToStorage();
            resetForm();
            renderRecords();
        }

        // Edit Entry (Trigger mode)
        function editRecord(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;

            document.getElementById('entry-id').value = record.id;
            document.getElementById('name').value = record.name;
            document.getElementById('age').value = record.age;

            // Update UI for Edit Mode
            document.getElementById('form-title').innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Edit Profile
            `;
            document.getElementById('btn-submit').textContent = 'Update Profile';
            document.getElementById('btn-cancel').style.display = 'inline-flex';
            
            editMode = true;
            document.getElementById('name').focus();
        }

        // Delete Entry
        function deleteRecord(id) {
            records = records.filter(r => r.id !== id);
            saveToStorage();
            renderRecords();
            // If deleting the record currently being edited, reset the form
            const currentEditId = document.getElementById('entry-id').value;
            if (currentEditId === id) {
                resetForm();
            }
        }

        // Reset Form to Create state
        function resetForm() {
            document.getElementById('crud-form').reset();
            document.getElementById('entry-id').value = '';
            
            document.getElementById('form-title').innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="19" y1="8" x2="19" y2="14"></line><line x1="16" y1="11" x2="22" y2="11"></line></svg>
                Create Profile
            `;
            document.getElementById('btn-submit').textContent = 'Save Profile';
            document.getElementById('btn-cancel').style.display = 'none';
            editMode = false;
        }

        // Render Records
        function renderRecords() {
            const searchVal = document.getElementById('search').value.toLowerCase();
            const container = document.getElementById('card-list');
            const countLabel = document.getElementById('record-count');
            
            const filteredRecords = records.filter(r => r.name.toLowerCase().includes(searchVal));
            
            countLabel.textContent = `${filteredRecords.length} record${filteredRecords.length !== 1 ? 's' : ''}`;

            if (filteredRecords.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        ${searchVal ? 'No profiles found matching your search.' : 'No profiles added yet. Create one on the left!'}
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredRecords.map(record => `
                <div class="card">
                    <div class="card-info">
                        <h3>${escapeHtml(record.name)}</h3>
                        <p>${escapeHtml(record.age)} years old</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon edit" onclick="editRecord('${record.id}')" title="Edit Profile">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button class="btn-icon delete" onclick="deleteRecord('${record.id}')" title="Delete Profile">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Helper to escape HTML tags
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Initial Render
        renderRecords();
    </script>
</body>
</html>
